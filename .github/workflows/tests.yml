name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # Los tests no usan el navegador: evita descargar Chrome en cada corrida
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
