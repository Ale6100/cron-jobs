name: Daily Deals Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    environment: cron
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute script
        run: node --import tsx daily-deals-report/index.ts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
