name: Daily Jobs Report

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil a ejecutar
        type: choice
        default: todos
        options:
          - todos
          - alejandro
          - alejandro-exactas
          - mariana
  schedule:
    # Todos los días a las 14:00 UTC (11:00 AM hora Argentina)
    - cron: '0 14 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    environment: cron
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: ${{ fromJSON((inputs.profile && inputs.profile != 'todos') && format('["{0}"]', inputs.profile) || '["mariana", "alejandro-exactas"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore seen jobs
        uses: actions/cache/restore@v4
        with:
          path: daily-jobs-report/state
          key: seen-jobs-${{ matrix.profile }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: seen-jobs-${{ matrix.profile }}-run-

      - name: Execute script
        run: node --import tsx daily-jobs-report/index.ts ${{ matrix.profile }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_MARIANA: ${{ secrets.TELEGRAM_CHAT_ID_MARIANA }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Save seen jobs
        if: hashFiles('daily-jobs-report/state/**') != ''
        uses: actions/cache/save@v4
        with:
          path: daily-jobs-report/state
          key: seen-jobs-${{ matrix.profile }}-run-${{ github.run_id }}-${{ github.run_attempt }}
